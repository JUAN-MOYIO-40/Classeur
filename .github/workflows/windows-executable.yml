name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        shell: cmd
        run: build_windows.bat

      - name: Create distribution archive
        shell: pwsh
        run: Compress-Archive -Path dist/MDJR_Classeur -DestinationPath MDJR_Classeur-Windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDJR_Classeur-Windows-x64
          path: MDJR_Classeur-Windows-x64.zip
          if-no-files-found: error

      - name: Publish release asset for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: MDJR_Classeur-Windows-x64.zip
