name: Build Windows executable

# Vérifie que les tests passent et que l'exécutable se construit toujours.
# L'archive publiée sur les releases est construite localement avec le moteur
# OCR embarqué (dossier tesseract/, non versionné) : ce workflow ne peut pas la
# reproduire et ne doit donc pas attacher d'archive concurrente à une release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller classeur.spec --distpath release --workpath build --noconfirm

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path release/Classeur/* -DestinationPath Classeur-Windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Classeur-Windows-x64
          path: Classeur-Windows-x64.zip
          if-no-files-found: error
